aid: adstageio
name: AdStage.io
description: >-
  AdStage was a cross-network advertising management, reporting, and automation
  platform (a 500 Startups / 500 Global portfolio company, founded 2013) that let
  marketers pull normalized advertising data from Google Ads, Microsoft/Bing Ads,
  Facebook, LinkedIn, Twitter, Instagram, Pinterest, Amazon, Google Analytics and
  more through a single unified interface. Its AdStage Data API (v1 and v2, HAL+JSON
  over HTTP with bearer-token / OAuth 2 auth) exposed user, organization, and
  advertising-entity data plus customizable cross-network reports. AdStage was
  acquired by TapClicks in April 2020 and folded into TapClicks' Marketing
  Intelligence platform; the standalone AdStage Data API (platform.adstage.io) is
  now defunct, though the AdStage GitHub organization and its API Blueprint
  documentation remain public. The adstage.io domain now serves unrelated
  PPC/advertising content under new ownership.
